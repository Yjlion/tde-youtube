name: Build Debian package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Debian ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container: debian:${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro: [trixie, bookworm]
    env:
      DEBIAN_FRONTEND: noninteractive
      TDE_MIRROR: http://mirror.ppa.trinitydesktop.org/trinity/deb

    steps:
      - name: Add the Trinity (TDE) repository
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git
          curl -fsSL -o /tmp/trinity-keyring.deb "$TDE_MIRROR/trinity-keyring.deb"
          dpkg -i /tmp/trinity-keyring.deb
          echo "deb $TDE_MIRROR/trinity-r14.1.x ${{ matrix.distro }} main deps" \
            > /etc/apt/sources.list.d/trinity.list
          apt-get update

      - name: Check out the source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends build-essential devscripts equivs lintian
          cd /tmp
          mk-build-deps --install --remove \
            --tool 'apt-get -y --no-install-recommends' \
            "$GITHUB_WORKSPACE/debian/control"

      - name: Build the package
        run: dpkg-buildpackage -us -uc -b

      - name: Run lintian
        run: lintian --info --display-info ../*.changes || true

      - name: Collect the packages
        run: |
          mkdir -p dist
          for f in ../*.deb; do
            b=$(basename "$f" .deb)
            cp "$f" "dist/${b}_${{ matrix.distro }}.deb"
          done
          ls -l dist
          dpkg -c dist/tde-youtube_*_${{ matrix.distro }}.deb

      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: tde-youtube-debian-${{ matrix.distro }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: Attach packages to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.deb
          generate_release_notes: true
